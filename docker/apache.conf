<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # ── Optional: Windows SSO via Kerberos / GSSAPI ──────────────────────
        # Uncomment the block below and supply a valid Kerberos keytab to enable
        # transparent SSO.  PHP will read the REMOTE_USER server variable that
        # mod_auth_gssapi sets and auto-provision the user via LDAP.
        #
        # AuthType GSSAPI
        # AuthName "LLMInt – Windows SSO"
        # GssapiCredStore keytab:/etc/krb5.keytab
        # GssapiLocalName On
        # Require valid-user
    </Directory>

    # Increase the maximum request body size to allow large document uploads.
    # Must match upload_max_filesize / post_max_size in php.ini.
    LimitRequestBody 104857600

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
