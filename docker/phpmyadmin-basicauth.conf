# docker/phpmyadmin-basicauth.conf
#
# Restricts access to the phpMyAdmin web root with HTTP Basic Auth.
# The credentials are generated at container start (see
# docker/phpmyadmin-entrypoint.sh) from the PMA_BASIC_AUTH_USER /
# PMA_BASIC_AUTH_PASSWORD environment variables, so phpMyAdmin is
# password-protected by default even before the phpMyAdmin login form
# is reached.
<Directory /var/www/html>
    AuthType Basic
    AuthName "Restricted - phpMyAdmin"
    AuthUserFile /etc/phpmyadmin-basicauth/.htpasswd
    Require valid-user
</Directory>
