; ── Upload limits ─────────────────────────────────────────────────────────────
; Allow documents up to 100 MB.  LimitRequestBody in apache.conf must match.
upload_max_filesize = 100M
post_max_size       = 100M

; ── Memory & execution ────────────────────────────────────────────────────────
memory_limit        = 1024M
; LLM streaming requests can take several minutes.
max_execution_time  = 3000
max_input_time      = 3000

; ── Session ───────────────────────────────────────────────────────────────────
session.cookie_httponly = 1
session.use_strict_mode = 1

; ── Reverse proxy (e.g. lanpa auth container) ─────────────────────────────────
; Normalises client IP, HTTPS and proxy SSO before any script or session
; starts. No-op unless TRUSTED_PROXIES is set.
auto_prepend_file = /var/www/html/lib/reverse_proxy.php

; ── Timezone ──────────────────────────────────────────────────────────────────
; Override with the TZ environment variable if needed.
date.timezone = Europe/Berlin
