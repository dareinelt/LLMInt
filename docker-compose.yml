services:

  # ── MySQL database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-llmint}
      MYSQL_USER:     ${DB_USER:-llmint}
      MYSQL_PASSWORD: ${DB_PASS:-llmint}
      # Use a strong root password in production!
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-changeme}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${DB_USER:-llmint}", "-p${DB_PASS:-llmint}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── PHP / Apache web server ──────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
      docconvert:
        condition: service_started
      milvus:
        condition: service_started
    environment:
      # Database connection (must match the db service above)
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-llmint}
      DB_USER: ${DB_USER:-llmint}
      DB_PASS: ${DB_PASS:-llmint}
      # Document conversion service (Office/text → text + chunks)
      DOCCONVERT_URL: ${DOCCONVERT_URL:-http://docconvert:8000}
      DOCCONVERT_TOKEN: ${DOCCONVERT_TOKEN:-}
      DOCCONVERT_TIMEOUT: ${DOCCONVERT_TIMEOUT:-120}
      # Local Milvus vector database (used when the admin selects
      # "Wissensdatenbank → lokale Milvus-Instanz"; docvecwizard exports are
      # imported into this instance). Can be overridden in the admin UI.
      MILVUS_URL: ${MILVUS_URL:-http://milvus:19530}
      MILVUS_METRICS_URL: ${MILVUS_METRICS_URL:-http://milvus:9091}
      # PHP timezone (overrides docker/php.ini if set)
      TZ: ${TZ:-Europe/Berlin}
      # Reverse proxy (e.g. lanpa auth container, see docker-compose.lanpa.yml):
      # IPs/CIDRs/host names whose X-Forwarded-* headers are trusted, and the
      # header carrying the Windows-SSO user ("X-Remote-User" for lanpa).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PROXY_SSO_HEADER: ${PROXY_SSO_HEADER:-}
    volumes:
      # Persist uploaded documents and generated images across restarts
      - doc_uploads:/var/www/html/doc_uploads
      - sd_output:/var/www/html/sd_output
      # docvecwizard export archives (*.tar.gz) placed here can be imported
      # from the admin UI without a browser upload.
      - vector_imports:/var/www/html/vector_imports
      # ── Optional: Windows SSO (Kerberos) ────────────────────────────────────
      # Mount a valid keytab and krb5.conf and uncomment the GSSAPI block in
      # docker/apache.conf to enable transparent Windows SSO.
      # - ./krb5.keytab:/etc/krb5.keytab:ro
      # - ./krb5.conf:/etc/krb5.conf:ro

  # ── Document converter (Office / text → RAG chunks) ──────────────────────────
  # Python/FastAPI service used by api/upload_document.php to turn DOCX, XLSX,
  # PPTX, ODF, CSV and plain-text files into structured text plus chunks.
  # Internal only: no host port is published.
  docconvert:
    build:
      context: ./docconvert
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Optional shared secret; when set, the web container must send the same
      # value (DOCCONVERT_TOKEN) in the X-Auth-Token header.
      DOCCONVERT_TOKEN: ${DOCCONVERT_TOKEN:-}
      DOCCONVERT_MAX_BYTES: ${DOCCONVERT_MAX_BYTES:-20971520}
      DOCCONVERT_MAX_CHARS: ${DOCCONVERT_MAX_CHARS:-1800}
      DOCCONVERT_OVERLAP: ${DOCCONVERT_OVERLAP:-250}
      DOCCONVERT_CACHE_TTL: ${DOCCONVERT_CACHE_TTL:-3600}
      DOCCONVERT_CACHE_MAX: ${DOCCONVERT_CACHE_MAX:-500}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Temporary chunk cache; survives restarts, pruned by TTL.
      - docconvert_cache:/var/cache/docconvert

  # ── Milvus vector database (standalone, embedded etcd + local storage) ───────
  # Holds the vectors imported from docvecwizard export archives when LLMInt
  # runs the knowledge base in "local" mode. Not needed when the remote
  # docvecwizard API mode is used – the service may then be stopped or removed.
  # Internal only: no host port is published.
  milvus:
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.5.27}
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - milvus_data:/var/lib/milvus
      - ./docker/milvus-embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    mem_limit: ${MILVUS_MEM_LIMIT:-2g}

  # ── phpMyAdmin ────────────────────────────────────────────────────────────────
  # Protected by HTTP Basic Auth (credentials from PMA_BASIC_AUTH_USER /
  # PMA_BASIC_AUTH_PASSWORD) in addition to the phpMyAdmin login form, so it
  # is password-protected by default. Change the defaults in .env before
  # deploying!
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/phpmyadmin-entrypoint.sh"]
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-llmint}
      PMA_PASSWORD: ${DB_PASS:-llmint}
      UPLOAD_LIMIT: 64M
      PMA_BASIC_AUTH_USER: ${PMA_BASIC_AUTH_USER:-admin}
      PMA_BASIC_AUTH_PASSWORD: ${PMA_BASIC_AUTH_PASSWORD:-changeme}
    volumes:
      - ./docker/phpmyadmin-entrypoint.sh:/usr/local/bin/phpmyadmin-entrypoint.sh:ro
      - ./docker/phpmyadmin-basicauth.conf:/etc/apache2/conf-enabled/zzz-basicauth.conf:ro

volumes:
  db_data:
  doc_uploads:
  sd_output:
  docconvert_cache:
  milvus_data:
  vector_imports:
