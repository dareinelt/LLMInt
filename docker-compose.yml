services:

  # ── MySQL database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-llmint}
      MYSQL_USER:     ${DB_USER:-llmint}
      MYSQL_PASSWORD: ${DB_PASS:-llmint}
      # Use a strong root password in production!
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-changeme}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${DB_USER:-llmint}", "-p${DB_PASS:-llmint}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── PHP / Apache web server ──────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
      docconvert:
        condition: service_started
      milvus:
        condition: service_started
      whisper:
        condition: service_started
      qwen:
        condition: service_started
    environment:
      # Database connection (must match the db service above)
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-llmint}
      DB_USER: ${DB_USER:-llmint}
      DB_PASS: ${DB_PASS:-llmint}
      # Document conversion service (Office/text → text + chunks)
      DOCCONVERT_URL: ${DOCCONVERT_URL:-http://docconvert:8000}
      DOCCONVERT_TOKEN: ${DOCCONVERT_TOKEN:-}
      DOCCONVERT_TIMEOUT: ${DOCCONVERT_TIMEOUT:-120}
      # Local Milvus vector database (used when the admin selects
      # "Wissensdatenbank → lokale Milvus-Instanz"; docvecwizard exports are
      # imported into this instance). Can be overridden in the admin UI.
      MILVUS_URL: ${MILVUS_URL:-http://milvus:19530}
      MILVUS_METRICS_URL: ${MILVUS_METRICS_URL:-http://milvus:9091}
      # Speech recognition / dictation (see lib/speech_dictation.php).
      # WHISPER_URL points at the whisper.cpp container below, QWEN_URL at the
      # dedicated llama.cpp container serving Qwen3.5-2B Q4. Both can be
      # overridden in the admin UI; leaving QWEN_URL empty makes the dictation
      # step use the regular endpoint pool instead.
      WHISPER_URL: ${WHISPER_URL:-http://whisper:8080}
      WHISPER_TOKEN: ${WHISPER_TOKEN:-}
      WHISPER_TIMEOUT: ${WHISPER_TIMEOUT:-120}
      QWEN_URL: ${QWEN_URL:-http://qwen:8080}
      QWEN_TOKEN: ${QWEN_TOKEN:-}
      QWEN_TIMEOUT: ${QWEN_TIMEOUT:-60}
      # PHP timezone (overrides docker/php.ini if set)
      TZ: ${TZ:-Europe/Berlin}
      # Reverse proxy (e.g. lanpa auth container, see docker-compose.lanpa.yml):
      # IPs/CIDRs/host names whose X-Forwarded-* headers are trusted, and the
      # header carrying the Windows-SSO user ("X-Remote-User" for lanpa).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PROXY_SSO_HEADER: ${PROXY_SSO_HEADER:-}
    volumes:
      # Persist uploaded documents and generated images across restarts
      - doc_uploads:/var/www/html/doc_uploads
      - sd_output:/var/www/html/sd_output
      # docvecwizard export archives (*.tar.gz) placed here can be imported
      # from the admin UI without a browser upload.
      - vector_imports:/var/www/html/vector_imports
      # ── Optional: Windows SSO (Kerberos) ────────────────────────────────────
      # Mount a valid keytab and krb5.conf and uncomment the GSSAPI block in
      # docker/apache.conf to enable transparent Windows SSO.
      # - ./krb5.keytab:/etc/krb5.keytab:ro
      # - ./krb5.conf:/etc/krb5.conf:ro

  # ── Document converter (Office / text → RAG chunks) ──────────────────────────
  # Python/FastAPI service used by api/upload_document.php to turn DOCX, XLSX,
  # PPTX, ODF, CSV and plain-text files into structured text plus chunks.
  # Internal only: no host port is published.
  docconvert:
    build:
      context: ./docconvert
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Optional shared secret; when set, the web container must send the same
      # value (DOCCONVERT_TOKEN) in the X-Auth-Token header.
      DOCCONVERT_TOKEN: ${DOCCONVERT_TOKEN:-}
      DOCCONVERT_MAX_BYTES: ${DOCCONVERT_MAX_BYTES:-20971520}
      DOCCONVERT_MAX_CHARS: ${DOCCONVERT_MAX_CHARS:-1800}
      DOCCONVERT_OVERLAP: ${DOCCONVERT_OVERLAP:-250}
      DOCCONVERT_CACHE_TTL: ${DOCCONVERT_CACHE_TTL:-3600}
      DOCCONVERT_CACHE_MAX: ${DOCCONVERT_CACHE_MAX:-500}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Temporary chunk cache; survives restarts, pruned by TTL.
      - docconvert_cache:/var/cache/docconvert

  # ── Milvus vector database (standalone, embedded etcd + local storage) ───────
  # Holds the vectors imported from docvecwizard export archives when LLMInt
  # runs the knowledge base in "local" mode. Not needed when the remote
  # docvecwizard API mode is used – the service may then be stopped or removed.
  # Internal only: no host port is published.
  milvus:
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.5.27}
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - milvus_data:/var/lib/milvus
      - ./docker/milvus-embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    mem_limit: ${MILVUS_MEM_LIMIT:-2g}

  # ── Speech recognition (whisper.cpp HTTP server) ──────────────────────────────
  # Used by the dictation feature in index.php through lib/speech_dictation.php.
  # Serves the OpenAI-independent whisper.cpp REST API (/inference, /health) on
  # port 8080. The GGML model is downloaded once into a named volume, so
  # restarts do not re-download it. Internal only: no host port is published.
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:${WHISPER_IMAGE_TAG:-main}
    # whisper.cpp only publishes a linux/amd64 image (the `main` tag is the
    # only moving tag). Declaring the platform keeps the service startable on
    # arm64 hosts such as Apple Silicon, where Docker emulates amd64 – slower
    # than native, but far better than the hard "no matching manifest" failure.
    platform: ${WHISPER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # NOTE: variables are written as $${VAR} so the container shell resolves
        # them at runtime. With a single dollar Compose would interpolate them
        # from the host environment instead, silently ignoring WHISPER_MODEL.
        MODEL="$${WHISPER_MODEL:-small}"
        FILE="/models/ggml-$${MODEL}.bin"
        if [ ! -s "$${FILE}" ]; then
          echo "[whisper] downloading model '$${MODEL}' ..."
          bash /app/models/download-ggml-model.sh "$${MODEL}" /models
        fi
        echo "[whisper] starting whisper-server with '$${FILE}'"
        exec whisper-server \
          --host 0.0.0.0 \
          --port 8080 \
          --model "$${FILE}" \
          --language "$${WHISPER_LANGUAGE:-de}" \
          --threads "$${WHISPER_THREADS:-4}" \
          --convert
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-de}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Persists ggml-*.bin so the model is fetched only on the first start.
      - whisper_models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Downloading the "small" model takes a while on first boot.
      start_period: 300s

  # ── Dictation model (Qwen3.5-2B Q4 via llama.cpp) ─────────────────────────────
  # Dedicated llama.cpp server that turns the raw Whisper transcript into clean,
  # command-processed text. Exposes the OpenAI-compatible API
  # (/v1/chat/completions, /health) on port 8080 and is reached by the web
  # container via QWEN_URL. Internal only: no host port is published.
  #
  # The GGUF is pulled from Hugging Face on first start and cached in the
  # qwen_cache volume (LLAMA_CACHE). Swap QWEN_IMAGE_TAG to `server-cuda`,
  # `server-vulkan` or `server-rocm` for GPU acceleration.
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:${QWEN_IMAGE_TAG:-server}
    restart: unless-stopped
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      # --hf-repo downloads (and caches) the quantised model from Hugging Face.
      - --hf-repo
      - ${QWEN_GGUF_REPO:-unsloth/Qwen3.5-2B-GGUF}
      - --hf-file
      - ${QWEN_GGUF_FILE:-Qwen3.5-2B-Q4_K_M.gguf}
      # The alias is the model id the dictation pipeline sends, so it must match
      # the "Qwen3.5-2B Q4" default in lib/speech_dictation.php.
      - --alias
      - ${QWEN_MODEL_ALIAS:-Qwen3.5-2B Q4}
      - --ctx-size
      - ${QWEN_CTX_SIZE:-4096}
      - --threads
      - ${QWEN_THREADS:-4}
      # Jinja templates are required for chat_template_kwargs.enable_thinking,
      # which the dictation client uses to keep the thinking block off.
      - --jinja
      - --no-webui
    environment:
      LLAMA_ARG_HOST: "0.0.0.0"
      # Keeps the downloaded GGUF inside the mounted volume.
      LLAMA_CACHE: /models
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - qwen_cache:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start downloads ~1.1 GB of model weights.
      start_period: 600s

  # ── phpMyAdmin ────────────────────────────────────────────────────────────────
  # Protected by HTTP Basic Auth (credentials from PMA_BASIC_AUTH_USER /
  # PMA_BASIC_AUTH_PASSWORD) in addition to the phpMyAdmin login form, so it
  # is password-protected by default. Change the defaults in .env before
  # deploying!
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/phpmyadmin-entrypoint.sh"]
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-llmint}
      PMA_PASSWORD: ${DB_PASS:-llmint}
      UPLOAD_LIMIT: 64M
      PMA_BASIC_AUTH_USER: ${PMA_BASIC_AUTH_USER:-admin}
      PMA_BASIC_AUTH_PASSWORD: ${PMA_BASIC_AUTH_PASSWORD:-changeme}
    volumes:
      - ./docker/phpmyadmin-entrypoint.sh:/usr/local/bin/phpmyadmin-entrypoint.sh:ro
      - ./docker/phpmyadmin-basicauth.conf:/etc/apache2/conf-enabled/zzz-basicauth.conf:ro

volumes:
  db_data:
  doc_uploads:
  sd_output:
  docconvert_cache:
  milvus_data:
  vector_imports:
  whisper_models:
  qwen_cache:
