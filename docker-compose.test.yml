# Test override for local verification of the dictation feature.
#
# The compute-heavy speech services (whisper.cpp and the llama.cpp dictation
# model) no longer run inside this stack: they live in the separate SpeechInt
# project (https://github.com/dareinelt/SpeechInt), usually on another Docker
# host. Point SPEECHINT_URL at such a service – see .env.example – and start
# only the services this check needs:
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d db web
services:
  web:
    depends_on: !override
      db:
        condition: service_healthy
